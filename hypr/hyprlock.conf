# ~/.config/hypr/hyprlock.conf

source = ~/.cache/wal/hyprland.conf

# General
general {
  no_fade_in = false
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

background {
    path   = $wallpaper
    brightness = 0.5
    blur_passes = 1
    blur_size = 3
}


# Time
label {
    text = cmd[update:1000] echo "$TIME"    
    color = $color1
    shadow_pass = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 150
    font_family = JetBrainsMono Nerd Font Propo ExtraBold
    position = 0, -250
    halign = center
    valign = top
}

# Date
label {
    text = cmd[update:1000] echo -e "$(date +"%d/%m/%Y")"
    color = $color2
    font_size = 25
    font_family = JetBrainsMono Nerd Font Propo ExtraBold
    position = 0, -470
    halign = center
    valign = top
}


# Input Field
input-field {
    size = 250, 60
    outline_thickness = 2
    outer_color = $color3
    dots_size = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = rgba(0, 0, 0, 0.7)
    font_color = $color3
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Propo ExtraBold
    placeholder_text = 
    hide_input = false
    position = 0, -470
    halign = center
    valign = center
    zindex = 10
}

# Battery
label {
    monitor = eDP-1
    text = cmd[update:1000] echo -e "$(~/.config/hypr/scripts/infobattery.sh)"
    color = $color4
    font_size = 15
    font_family = JetBrainsMono Nerd Font Propo ExtraBold
    position = -20, -510
    halign = right
    valign = center
}

# Arch Logo
