# ~/.config/hypr/keybindings.conf

$mainMod = SUPER

# Hyprland keybindings
bind = $mainMod SHIFT, R, exec, hyprctl reload

# App shortcuts
bind = $mainMod, Return, exec, kitty
bind = $mainMod, p, exec, rofi -show drun
bind = $mainMod, b, exec, sh -c "command -v librewolf >/dev/null && exec librewolf || command -v firefox >/dev/null && exec firefox"
bind = $mainMod, f, exec, nemo

# Window management
bind = $mainMod, q, killactive
bind = $mainMod, m, fullscreen
bind = $mainMod, s, togglefloating

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Screenshot Fullscreen
bind = , Print, exec, screenshot
# Screenshot Active Monitor
bind = ALT, Print, exec, screenshot monitor

# LockScreen
bind = $mainMod, l, exec, hyprlock

# Wallpaper Manager
bind = $mainMod, w, exec, waypaper

# Volume Up (PipeWire)
bindel = , f3, exec, wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && wp-vol
# Volume Down
bindel = , f2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wp-vol
# Mute / Unmute
bindl = , f1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && wp-vol

# Brightness Up
bindel = , f6, exec, brightnessctl set 5%+ && brightness-osd
# Brightness Down
bindel = , f5, exec, brightnessctl set 5%- && brightness-osd


# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# MONITOR 2
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod ALT, right, workspace, e+1
bind = $mainMod ALT, left, workspace, e-1

# Mouse bindings for move/resize
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
