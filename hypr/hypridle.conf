# ~/.config/hypr/hypridle.conf

general {
    lock_cmd          = pidof hyprlock || hyprlock   # don’t spawn duplicates
    before_sleep_cmd  = loginctl lock-session        # lock before suspend
    after_sleep_cmd   = hyprctl dispatch dpms on     # wake the panel
}

# 1 min → gently dim the LCD
listener {
    timeout    = 60
    on-timeout = brightnessctl -s  set 5   # ~5 %
    on-resume  = brightnessctl -r
}

# 2 min → lock the session
listener {
    timeout    = 120
    on-timeout = loginctl lock-session
}

# 3 min → turn the panel off (DPMS)
listener {
    timeout    = 180
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on && brightnessctl set $(brightnessctl max)
}

# 5 min → suspend to RAM
listener {
    timeout    = 300
    on-timeout = systemctl suspend
}


# • Device name “intel_backlight” is standard for a T480’s internal LCD.
#   Verify with `brightnessctl -l` if you ever swap panels.
#
# • `-s / -r` pair saves & restores your previous brightness.
#
# • On battery you might want shorter timeouts; Hypridle ≥0.3 supports
#   `timeout_bat` / `timeout_ac` per listener.
#
# • Enable and start once:
#       systemctl --user enable --now hypridle.service
#
# • Debug idle triggers with:
#       hypridle --debug
