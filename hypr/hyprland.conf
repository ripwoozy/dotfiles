# ~/.config/hypr/hyprland.conf

# Some default env vars.
env = XCURSOR_SIZE,2
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

env = HYPRCURSOR_SIZE,20

# Monitors and Workspaces
monitor = eDP-1,preferred,auto,1
monitor = HDMI-A-2,2560x1440@60,auto,1
monitor = DP-1,2560x1440@144,auto,1

workspace = 1, persistent:true, monitor:eDP-1
workspace = 2, persistent:true, monitor:eDP-1
workspace = 3, persistent:true, monitor:eDP-1
workspace = 4, persistent:true, monitor:eDP-1
workspace = 5, persistent:true, monitor:eDP-1

#workspace = 6, persistent:true, monitor:HDMI-A-2
#workspace = 7, persistent:true, monitor:HDMI-A-2
#workspace = 8, persistent:true, monitor:HDMI-A-2
#workspace = 9, persistent:true, monitor:HDMI-A-2
#workspace = 10, persistent:true, monitor:HDMI-A-2

workspace = 6, persistent:true, monitor:DP-1
workspace = 7, persistent:true, monitor:DP-1
workspace = 8, persistent:true, monitor:DP-1
workspace = 9, persistent:true, monitor:DP-1
workspace = 10, persistent:true, monitor:DP-1

# Imports
source = ./autostart.conf
source = ./keybindings.conf
source = ~/.cache/wal/hyprland.conf
source = ./windowrules.conf

# Input
input {
    kb_layout = it
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# General

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = $color1 $color2 $color3 $color4 $color5 90deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    layout = bsp
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

