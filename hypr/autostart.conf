# ~/.config/hypr/autostart.conf

# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Restore wallpaper and pywal colorscheme on startup
exec-once = wal -R
exec-once = waypaper --restore

# Set GTK theme and color scheme on startup  (Generated by wpgtk)
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "linea-nord-color"
exec-once = gsettings set org.gnome.desktop.interface icon-theme "flattrcolor-dark"
exec-once = gsettings set org.gnome.desktop.interface font-name "JetBrainsMonoNL Nerd Font 11"
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name "JetBrainsMono Nerd Font 11"

# Start hypridle and waybar on startup
exec-once = hypridle
exec-once = waybar
